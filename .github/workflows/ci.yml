name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore TeamAvailability.sln
      - run: dotnet build TeamAvailability.sln --configuration Release --no-restore
      - run: dotnet test TeamAvailability.sln --configuration Release --no-build --verbosity normal
